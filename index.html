<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Phone Booth · starter</title>
<!--
  SENSE (เครื่องรับรู้อะไร):  motion · where · swipe   (level 1 เพิ่ม gesture · level 2 เพิ่ม count, speed)
  DO    (แล้วทำอะไร):        ผนัง: เส้นแสงโค้งนูนตรงจุดที่มีคนขยับ ยิ่งขยับแรงยิ่งสว่าง
                             กล่อง: ปัดมือแล้วมีแถบแสงวิ่งผ่านตามทิศที่ปัด
  FOR   (เพื่ออะไร):         ______  ← เติมเอง
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  [data-surface] { position: absolute; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div data-surface="wall" style="left:60px; top:60px; width:640px; height:400px;">
  <canvas id="wall" width="640" height="400"></canvas>
</div>
<div data-surface="box" style="left:760px; top:160px; width:300px; height:300px;">
  <canvas id="box" width="300" height="300"></canvas>
</div>

<script src="sense.js"></script>
<script src="map.js"></script>
<script>
  // ?level=1 หรือ ?level=2 ต่อท้ายชื่อไฟล์ เพื่อเปลี่ยนระดับ
  const level = Number(new URLSearchParams(location.search).get('level') || 0);
  sense.start({ level });

  const wall = document.getElementById('wall').getContext('2d');
  const box = document.getElementById('box').getContext('2d');
  const WW = 640, WH = 400, BS = 300;

  // ---- กล่อง: แถบแสงวิ่งตามทิศที่ปัด ----
  let sweep = null;   // { dir, t }
  sense.on('swipe', dir => { sweep = { dir, t: 0 }; });
  let ring = 0;
  sense.on('gesture', name => { if (name !== 'none') ring = 1; });

  function drawWall(t) {
    wall.fillStyle = 'rgba(0,0,0,0.25)';
    wall.fillRect(0, 0, WW, WH);
    const rows = 14;
    const cx = sense.where.x * WW, cy = sense.where.y * WH;
    const bump = 20 + sense.motion * 160;
    wall.lineWidth = 1.5;
    wall.strokeStyle = 'rgba(200,255,240,' + (0.25 + sense.motion * 0.75) + ')';
    for (let r = 0; r < rows; r++) {
      const y0 = (r + 0.5) * WH / rows;
      wall.beginPath();
      for (let x = 0; x <= WW; x += 8) {
        const d = Math.hypot(x - cx, y0 - cy);
        const lift = bump * Math.exp(-(d * d) / (2 * 90 * 90));
        const y = y0 - lift + Math.sin(x * 0.02 + t * 0.002 + r) * 2;
        x === 0 ? wall.moveTo(x, y) : wall.lineTo(x, y);
      }
      wall.stroke();
    }
  }

  function drawBox() {
    box.fillStyle = 'rgba(0,0,0,0.2)';
    box.fillRect(0, 0, BS, BS);
    box.strokeStyle = 'rgba(255,255,255,0.6)';
    box.lineWidth = 2;
    box.strokeRect(6, 6, BS - 12, BS - 12);           // ขอบกล่อง ใช้ตอน map ให้ตรงมุม

    if (sweep) {
      sweep.t += 0.04;
      const p = sweep.t * BS;
      box.fillStyle = '#c8ff3a';
      if (sweep.dir === 'right') box.fillRect(p - 30, 0, 30, BS);
      if (sweep.dir === 'left') box.fillRect(BS - p, 0, 30, BS);
      if (sweep.dir === 'down') box.fillRect(0, p - 30, BS, 30);
      if (sweep.dir === 'up') box.fillRect(0, BS - p, BS, 30);
      if (sweep.t > 1.2) sweep = null;
    }
    if (ring > 0) {                                    // level 1: เปลี่ยนท่ามือ
      box.strokeStyle = 'rgba(255,212,0,' + ring + ')';
      box.beginPath(); box.arc(BS / 2, BS / 2, (1 - ring) * BS * 0.6, 0, 7); box.stroke();
      ring -= 0.03;
    }
    for (let i = 0; i < sense.count; i++) {            // level 2: หนึ่งเส้นต่อหนึ่งคน
      const x = (i + 1) * BS / (sense.count + 1);
      box.fillStyle = 'rgba(255,61,240,' + (0.3 + sense.speed * 0.7) + ')';
      box.fillRect(x - 2, 20, 4, BS - 40);
    }
  }

  function frame(t) {
    drawWall(t);
    drawBox();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
